[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "vanna-volga-hybrid-pricer"
version = "0.3.0"
description = "Compact hybrid Python/C++ Vanna-Volga FX option pricer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
vv-pricer = "vv_pricer.cli:main"

[tool.scikit-build]
cmake.version = ">=3.20"
wheel.packages = ["vv_pricer"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-ra"
